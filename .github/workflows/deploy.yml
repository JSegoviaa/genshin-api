name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'develop' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_ENV: ${{ github.ref_name == 'main' && '' || 'develop' }}
      DOCS_MODE: ${{ github.ref_name == 'main' && 'production' || 'develop' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix docs

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build docs
        working-directory: docs
        run: npm run build -- --mode "$DOCS_MODE"

      - name: Deploy API
        run: npx wrangler deploy --env "$WRANGLER_ENV"

      - name: Deploy docs
        working-directory: docs
        run: npx wrangler deploy --env "$WRANGLER_ENV"
