name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'develop' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_ENV: ${{ github.ref_name != 'main' && 'develop' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix docs

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build docs
        working-directory: docs
        env:
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          for name in PUBLIC_API_URL PUBLIC_TURNSTILE_SITE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the GitHub environment"
              exit 1
            fi
          done
          npm run build

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote --env "$WRANGLER_ENV"

      - name: Deploy API
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          if [ -z "$TURNSTILE_SECRET_KEY" ]; then
            echo "::error::TURNSTILE_SECRET_KEY is not set in the GitHub environment"
            exit 1
          fi
          node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({ TURNSTILE_SECRET_KEY: process.env.TURNSTILE_SECRET_KEY }))' "$RUNNER_TEMP/secrets.json"
          npx wrangler deploy --env "$WRANGLER_ENV" --secrets-file "$RUNNER_TEMP/secrets.json"

      - name: Deploy docs
        working-directory: docs
        run: npx wrangler deploy --env "$WRANGLER_ENV"
