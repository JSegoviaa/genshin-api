services:
  rustfs:
    image: rustfs/rustfs:1.0.5
    container_name: genshin-rustfs
    ports:
      - "${LOCAL_S3_PORT:-9100}:9000"
      - "${LOCAL_S3_CONSOLE_PORT:-9101}:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${LOCAL_S3_ACCESS_KEY_ID:-genshin}
      RUSTFS_SECRET_KEY: ${LOCAL_S3_SECRET_ACCESS_KEY:-genshin-local-secret}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOG_DIRECTORY: ""
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  rustfs-data:
